  <p class="foot">자료: FRED(ICE BofA 스프레드·연준 대차대조표·국채 금리) · 한국은행 ECOS · multpl.com. ICE 스프레드는 FRED 가 최근 3년치만 내주므로 백분위도 최근 3년 기준이다. 이 화면은 정보 정리용이며 비중을 권하지 않는다.</p>
