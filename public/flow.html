<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수급 · Beom's Macro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/macro.css">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<main>
  <div class="page-head"><h1>수급 · 포지셔닝 <span class="use timing">타이밍</span> <span class="use flow">흐름</span></h1><p>빚내서 산 돈이 얼마나 쌓였나, 큰손이 어느 쪽에 서 있나</p></div>
  <div class="grid2">
    <section class="card" id="credit"></section>
    <section class="card" id="forced"></section>
  </div>
  <section class="card" id="ev"></section>
  <div class="grid2">
    <section class="card" id="deposit"></section>
    <section class="card" id="china"></section>
  </div>
  <section class="card" id="cftc"></section>
  <section class="card" id="cta"></section>
  <section class="card" id="volctl"></section>
  <div class="grid2">
    <section class="card" id="dix"></section>
    <section class="card" id="gex"></section>
  </div>
  <section class="card" id="dixev"></section>
  <p class="foot">자료: 금융투자협회(신용공여·증시자금) · 이스트머니 공개 자료(중국 융자융권) · CFTC TFF 보고서(매주 금요일 발표, 화요일 기준) · SqueezeMetrics(DIX·GEX). CTA 포지션·변동성 제어 펀드 노출은 IB 추정치라 무료 자료가 없어 가격만으로 직접 어림한 모델이다(식은 카드에 적음).</p>
</main>
<script src="js/mu.js"></script>
<script src="js/mchart.js"></script>
<script src="js/flow.js"></script>
</body>
</html>
