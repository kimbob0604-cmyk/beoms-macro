<main>
  <div class="page-head"><h1>AI 크레딧 <span class="use weight">비중</span> <span class="use sector">섹터</span></h1><p>AI 투자를 빚으로 대는 회사들의 신용 — 하이퍼스케일러·네오클라우드 CDS, 등급별 스프레드, 사모대출</p></div>
  <section class="card" id="stress"></section>
  <section class="card" id="names"></section>
  <div class="grid2">
    <section class="card" id="grades"></section>
    <section class="card" id="private"></section>
  </div>
  <section class="card" id="eq"></section>
  <p class="foot">개별 기업 CDS 는 무료로 매일 받을 수 있는 곳이 없다(블룸버그·S&P 유료). 그래서 ① 매일 자동으로 갱신되는 대용 지표(등급별 스프레드·사모대출 ETF·주가 낙폭)로 스트레스 지수를 만들고 ② CDS 는 기사에 나온 값을 날짜·출처와 함께 적어 둔다. 자료: FRED(ICE BofA) · Yahoo Finance · 각 기사.</p>
