<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타이밍 · Beom's Macro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/macro.css">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<main>
  <div class="page-head"><h1>타이밍 <span class="use timing">타이밍</span></h1><p>지금이 살 만한 자리인가, 과열인가 — 극단일 때만 의미가 있는 역발상 지표</p></div>
  <div class="grid2">
    <section class="card" id="bottom"></section>
    <section class="card" id="hot"></section>
  </div>
  <section class="card" id="evidence"></section>
  <div class="grid2">
    <section class="card" id="fg-kr"></section>
    <section class="card" id="fg-us"></section>
  </div>
  <section class="card" id="fg-ev"></section>
  <div class="grid2">
    <section class="card" id="c-adr"></section>
    <section class="card" id="c-breadth"></section>
  </div>
  <div class="grid2">
    <section class="card" id="c-ma"></section>
    <section class="card" id="c-count"></section>
  </div>
  <div class="grid2">
    <section class="card" id="c-vix"></section>
    <section class="card" id="c-vkospi"></section>
  </div>
  <p class="foot">기준선(ADR 75·120 등)은 관례 값이다. '상위 5%'는 그날 이전 3년(750거래일)만으로 계산해 미래 값을 쓰지 않는다. 신용잔고·반대매매·DIX 는 수급 탭에 있다.</p>
</main>
<script src="js/mu.js"></script>
<script src="js/mchart.js"></script>
<script src="js/timing.js"></script>
</body>
</html>
