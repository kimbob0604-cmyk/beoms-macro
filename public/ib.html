<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IB 지표판 · Beom's Macro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/macro.css">
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<main>
  <div class="page-head"><h1>IB 지표판 <span class="use weight">비중</span> <span class="use timing">타이밍</span></h1><p>글로벌 IB 전략팀이 보는 지표를 공개된 재료로 직접 만든 것 — 원래 정의와 우리가 만든 범위를 나란히</p></div>
  <section class="card" id="summary"></section>
  <section class="card" id="rai"></section>
  <section class="card" id="gb"></section>
  <section class="card" id="pe"></section>
  <p class="foot">원래 지표는 각 회사의 내부 자료(포지션·설문·자금 유입)를 쓰기 때문에 숫자가 똑같이 나오지 않는다. 여기 값은 '같은 생각을 공개 자료로 옮긴 것'이고, 구성요소와 식을 모두 화면에 적었다. 자료: Yahoo Finance(ETF·지수) · FRED · FINRA · CFTC · SqueezeMetrics · multpl.</p>
</main>
<script src="js/mu.js"></script>
<script src="js/mchart.js"></script>
<script src="js/ib.js"></script>
</body>
</html>
