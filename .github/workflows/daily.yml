# 30분마다 수집 → 빌드 → DB 올리기 → 암호로 잠근 사이트 배포. 맥이 꺼져 있어도 돈다.
#
# 순서: DB 받기(sync.py pull) → 수집·빌드(run_daily.py, 기존 대시보드 DB 없이 혼자 돌기) → DB 올리기(sync.py push)
#       → 데이터를 잠가 배포본 만들기(site_crypt.py) → GitHub Pages 배포.
# 하루씩 쌓는 값(풋콜·옵션·선물 수급)은 DB 에만 있어서, 받기와 올리기 사이에 다른 실행이 끼지 않게 한 번에 하나만 돈다(concurrency).
# GitHub 예약은 늦거나 몰려 돌 때가 있어, 20분 안에 이미 올렸으면 건너뛴다. 공개 저장소라 Actions 시간은 무료.
#
# 필요한 비밀값(저장소 Settings → Secrets → Actions): KRX_API_KEY · FRED_KEY · ECOS_KEY · KIS_APP_KEY · KIS_APP_SECRET · MACRO_PASS(화면 암호) · MACRO_DB_PASS(DB 사본 암호)
# 알림을 켤 때만: MACRO_TG_TOKEN · MACRO_TG_CHAT (토큰이 있으면 켜진다. 끄려면 MACRO_TG_TOKEN 을 지운다)
name: daily

on:
  schedule:                      # 30분마다 (2026-11-24 사용자 요청: 하루 세 번 → 30분). 시각은 UTC 지만 30분 간격이라 상관없다
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 방금 돌았어도 다시 돈다
        type: boolean
        default: false
      dry:
        description: 시험 — 수집·빌드만 하고 DB·사이트는 올리지 않는다 (출처별로 되는지 확인)
        type: boolean
        default: false
      preview:
        description: 텔레그램 정기 보고를 [미리보기]로 지금 한 번 보낸다(차트 캡처 포함)
        type: boolean
        default: false

permissions:
  contents: write        # 릴리스 첨부(DB 사본)
  pages: write
  id-token: write
  actions: write         # 예약이 60일 뒤 꺼지지 않게 다시 켜 둔다

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      MACRO_STANDALONE: '1'
      MACRO_FORCE: ${{ (inputs.force || inputs.dry) && '1' || '' }}
      GH_TOKEN: ${{ github.token }}
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
      FRED_KEY: ${{ secrets.FRED_KEY }}
      ECOS_KEY: ${{ secrets.ECOS_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      MACRO_PASS: ${{ secrets.MACRO_PASS }}
      MACRO_DB_PASS: ${{ secrets.MACRO_DB_PASS }}
      # 알림은 토큰이 있으면 켠다. 켜기 표시를 비밀값 '1' 로 두면 실행 기록의 숫자 1 이 모두 *** 로 가려져서 비밀값으로 받지 않는다
      MACRO_TG_ENABLED: ${{ secrets.MACRO_TG_TOKEN != '' && '1' || '' }}
      MACRO_TG_TOKEN: ${{ secrets.MACRO_TG_TOKEN }}
      MACRO_TG_CHAT: ${{ secrets.MACRO_TG_CHAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -q -r requirements.txt
      - id: fresh
        run: python3 sync.py fresh 20
      - name: DB 받기
        if: steps.fresh.outputs.skip != 'true'
        run: python3 sync.py pull
      - name: 수집·빌드
        if: steps.fresh.outputs.skip != 'true'
        run: python3 run_daily.py --report || true
      - name: 알림 미리보기
        if: inputs.preview
        run: python3 alert.py --preview
      - name: DB 올리기
        if: steps.fresh.outputs.skip != 'true' && !inputs.dry
        run: python3 sync.py push
      - name: 데이터를 잠가 배포본 만들기
        if: steps.fresh.outputs.skip != 'true' && !inputs.dry
        run: python3 site_crypt.py _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.fresh.outputs.skip != 'true' && !inputs.dry
        with:
          path: _site
          retention-days: 1
      # 업로드 직후 배포가 '아티팩트 0개'로 실패할 때가 있다(2026-11-24 09:05·04:29, GitHub 쪽 지연).
      # 그러면 DB 는 올라갔는데 사이트만 옛날 것으로 남고, 다음 예약은 '100분 안에 올렸음'으로 건너뛴다 → 잠시 뒤 두 번 더 시도.
      - id: deploy
        if: steps.fresh.outputs.skip != 'true' && !inputs.dry
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy2.outcome == 'failure'
        run: sleep 90
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: 예약 켜 두기
        if: always()
        run: gh workflow enable daily.yml -R "$GITHUB_REPOSITORY" || true
